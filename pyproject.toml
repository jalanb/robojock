[build-system]
requires = [ "setuptools >= 50.0.0", "wheel >= 0.29.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robojock"
version = "0.0.1"
description = "Robojock interfaces to a local iTunes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT License"}
authors = [
    {name = "jalanb", email = "github@al-got-rhythm.net"}
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Development Status :: 1 - Planning",
    "Natural Language :: English",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


# Core dependencies
dependencies = [
    "appscript",
    "typer",
]

[project.optional-dependencies]
# Extras for app
app = [
    "robojock",
]

# Linting tools - standalone, no project dependencies needed
lint = [
    "black",
    "blackdoc",
    "flake8",
    "flake8-bugbear",
    "flake8-comprehensions",
    "flake8-eradicate",
    "flake8-isort",
    "Flake8-pyproject",
    "isort",
    "mypy",
]

# Testing needs project + test tools
test = [
    "robojock",
    "callee",
    "codecov",
    "coverage",
    "docker",
    "httpx",
    "pytest",
    "pytest-cov",
    "pytest-docker",
    "tox",
]

# DevOps needs testing capabilities plus deployment tools
devops = [
    "robojock[test]",
    "robojock[lint]",
    "bump2version",
    "build",
]

# Full development environment: DevOps + Dev Tools
develop = [
    "robojock[devops]",
    "httpie",
    "ipython",
    "pudb",
    "pytest-pudb",
    "pytest-sugar",
    "sh",
]

[tool.setuptools.packages.find]
include = ["robojock*"]
exclude = ["test_*.py"]

[tool.flake8]
# https://black.readthedocs.io/en/stable/compatible_configs.html#flake8
max-line-length = 88
ignore = ["E731", "E203", "W503"]

[tool.mypy]
ignore_missing_imports = true
install_types = true
non_interactive = true
check_untyped_defs = true
strict_optional = true

[tool.coverage.run]
branch = true
parallel = true
source = ["robojock"]
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == \"__main__\":",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--doctest-modules --doctest-glob=*.test --doctest-glob=*.md"
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]

[tool.tox]
envlist = ["lints", "tests"]
[tool.tox.env.lints]
deps = [".[lint]"]
commands = [
    ["black", "-S", "--check", "robojock"],
    ["blackdoc", "-S", "--check", "robojock"],
    ["flake8", "robojock"],
    ["mypy", "robojock"],
]

[tool.tox.env.tests]
deps = [".[test]"]
commands = [
    ["py.test", "--cov=robojock", "robojock", "tests" ]
]

[tool.tox.env.devs]
deps = [".[develop]"]
commands = [
    ["py.test", "--exitfirst", "robojock", "tests" ]
]

[tool.tox.env.pudb]
deps = [".[develop]"]
commands = [
    ["py.test", "--pudb", "robojock", "tests" ]
]

[project.scripts]
robojock = "robojock.__main__:main"

